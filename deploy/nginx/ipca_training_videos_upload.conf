# Same-origin Training Video admin uploads. Include inside the TLS server block
# before `location ~ \.php$`, then: nginx -t && systemctl reload nginx
#
# Browser PUTs to Spaces are blocked by bucket CORS; this location streams
# the file through ipca.training instead.

location = /admin/api/training_videos_upload.php {
    client_max_body_size 5120m;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 7200;
    fastcgi_send_timeout 7200;
    fastcgi_param PHP_VALUE "post_max_size=5120M
upload_max_filesize=5120M
max_execution_time=7200
max_input_time=7200
memory_limit=256M";
}
